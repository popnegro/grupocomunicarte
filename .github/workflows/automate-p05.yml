name: Automate P0.5 cleanup

on:
  push:
    branches:
      - feat/fase-02-ubicaciones-destacadas

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply P0.5 refactor
        shell: python
        run: |
          from pathlib import Path
          import re

          cms = Path("src/components/CmsContext.tsx")
          text = cms.read_text()

          seed_start = text.index("const SEED_SCREENS: DoohScreen[] = [")
          default_start = text.index("const DEFAULT_LANDING_CONTENT", seed_start)
          text = text[:seed_start] + text[default_start:]

          text, count = re.subn(
              r"  screens: \(\(\) => \{.*?\n  \}\)\(\),\n  loadingScreens: false,",
              "  screens: [],\n  loadingScreens: false,",
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected one screens initializer, found {count}")

          text = text.replace(
              '  setScreens: (screens: DoohScreen[] | ((prev: DoohScreen[]) => DoohScreen[])) => void;',
              '  setScreens: (screens: DoohScreen[] | ((prev: DoohScreen[]) => DoohScreen[])) => void;'
          )

          text = text.replace(
              '  updateScreenStatus: (id: string, status: "Activo" | "Pausado" | "Disponible" | "No disponible") => void;',
              '  updateScreenStatus: (id: string, status: "Activo" | "Pausado" | "Disponible" | "No disponible") => Promise<void>;'
          )

          text = text.replace(
              '  setScreens: (valueOrFn) => set((state) => {\n    const nextScreens = typeof valueOrFn === "function" ? valueOrFn(state.screens) : valueOrFn;\n    localStorage.setItem("smartweb_dooh_screens", JSON.stringify(nextScreens));\n    return { screens: nextScreens };\n  }),',
              '  setScreens: (valueOrFn) => set((state) => {\n    const nextScreens = typeof valueOrFn === "function" ? valueOrFn(state.screens) : valueOrFn;\n    return { screens: nextScreens };\n  }),'
          )

          old_status = '''  updateScreenStatus: (id, status) => set((state) => {\n    const nextScreens = state.screens.map((s) => (s.id === id ? { ...s, status } : s));\n    localStorage.setItem("smartweb_dooh_screens", JSON.stringify(nextScreens));\n    return { screens: nextScreens };\n  }),'''
          new_status = '''  updateScreenStatus: async (id, status) => {\n    await get().updateScreen(id, { status });\n  },'''
          if old_status not in text:
              raise SystemExit("Expected updateScreenStatus implementation not found")
          text = text.replace(old_status, new_status)

          text = text.replace('        localStorage.setItem("smartweb_dooh_screens", JSON.stringify(res.data.data));\n', '')

          cms.write_text(text)

          media = Path("src/utils/screenMedia.ts")
          text = media.read_text()
          text = text.replace('import { DoohScreen } from "../types";', 'import { DoohScreen, ScreenMedia } from "../types";')
          marker = 'type NormalizedMediaItem = {\n'
          source_type = '''type ScreenMediaSource = {\n  id: string;\n  video?: string | null;\n  media?: ScreenMedia[];\n};\n\ntype FeaturedScreenSource = Pick<DoohScreen, "id" | "nombre" | "isFeatured" | "featuredOrder">;\n\n'''
          if 'type ScreenMediaSource = {' not in text:
              text = text.replace(marker, source_type + marker, 1)
          text = text.replace('export function sortFeaturedScreens(screens: DoohScreen[], limit = MAX_FEATURED_LOCATIONS)', 'export function sortFeaturedScreens(screens: FeaturedScreenSource[], limit = MAX_FEATURED_LOCATIONS)')
          text = text.replace('Pick<DoohScreen, "id" | "video" | "media">', 'ScreenMediaSource')
          media.write_text(text)

          print("P0.5 refactor applied")

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Validate build
        run: npm run build

      - name: Validate P0.5 search
        shell: bash
        run: |
          ! grep -R "SEED_SCREENS" src
          ! grep -R "smartweb_dooh_screens" src

      - name: Commit changes and remove automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/automate-p05.yml
          git add src/components/CmsContext.tsx src/utils/screenMedia.ts
          git commit -m "fix(p0): remove mock screen persistence and decouple media types"
          git push