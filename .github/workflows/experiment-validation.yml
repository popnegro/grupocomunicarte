name: Experiment validation

on:
  push:
    branches:
      - experiment/pmv-inventory-explorer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: experiment/pmv-inventory-explorer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and synchronize lockfile
        run: npm install --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile [skip ci]"
          git push origin HEAD:experiment/pmv-inventory-explorer

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
