name: PMV Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/stabilize-main
      - integrate/canonical-public-dashboard-v2

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Persist generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/integrate/canonical-public-dashboard-v2' && hashFiles('package-lock.json') == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "build: persist canonical package lock"
          git push

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
