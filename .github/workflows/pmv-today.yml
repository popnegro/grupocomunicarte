name: PMV Today — Remix Landing

on:
  push:
    branches:
      - audit/ux-ui-remix
  pull_request:
    branches:
      - audit/ux-ui-remix
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: remix-landing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remix-landing/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Validate Explorer skeleton import
        run: |
          count=$(grep -c "^import { ExplorerInventorySkeleton } from './ExplorerSkeleton';$" src/components/ExplorerPage.tsx || true)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one ExplorerInventorySkeleton import; found $count"
            exit 1
          fi

      - name: Validate MediaKit audience typing
        run: |
          if ! grep -q "MediaKitAudience" src/components/MediaKitStudio.tsx; then
            echo "MediaKitStudio.tsx is missing MediaKitAudience typing"
            exit 1
          fi

      - name: Validate CSS escaping
        run: |
          if grep -nF '\\[' src/components/dashboard-media-kit.css; then
            echo "Double-escaped CSS selectors remain in dashboard-media-kit.css"
            exit 1
          fi

      - name: Diff hygiene
        run: git diff --check

      - name: Accidental empty files
        run: |
          for file in "=" "react" "react-router-dom" "{"; do
            if [ -f "$file" ]; then
              echo "Accidental file remains: $file"
              exit 1
            fi
          done

      - name: PMV result
        run: |
          echo "PMV TODAY validation passed."
          echo "lint: PASS"
          echo "build: PASS"
          echo "reconciliation checks: PASS"
